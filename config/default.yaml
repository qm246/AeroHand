# AeroHand v0.5.3 — Canonical Default Configuration
# User customizations are persisted as minimal deltas in `config/user_overrides.yaml`.

ui:
  language: "vi"                       # "vi" (Tiếng Việt) | "en" (English)
  theme: "dark"
  onboarding_completed: false
  show_timing_panel: true
  show_click_feedback: true            # On-screen click pulse ripple at cursor
  cursor_style: "arrow"                # "arrow" | "circle" | "crosshair"
  cursor_size: 1.0
  show_palm_wheel_overlay: true        # On-screen 5-petal radial menu overlay
  palm_wheel_fixed: false              # false = follow palm position, true = center screen
  show_window_tile_preview: true       # Frosted glass snap-zone preview before release
  show_collector_overlay: true         # Large floating top-center teleprompter while recording in ML Studio
  enable_tracking_warnings: true       # Smart warnings: low light, too far/close, edge
  hints:
    click: false
    right_click: true
    grab: true
    scroll: true
    zoom: true
    window_tile: true
    spaces_nav: true
    dictation: true
  camera_hud:
    visible: true
    position: "bottom-right"           # "top-left" | "top-right" | "bottom-left" | "bottom-right"
    size: "medium"                     # "small" | "medium" | "large"
    opacity: 0.55                      # Idle opacity (Airpoint hover-fade UX)
    hover_opacity: 1.0                 # Opacity when hovering cursor over HUD
    show_connections: true
    show_landmarks: true

camera:
  device_id: ""                        # Empty = auto default camera; or AVFoundation uniqueID
  index: 0
  width: 640
  height: 480
  aspect_ratio: "4:3"                  # "auto" | "16:9" | "4:3" | "1:1"
  fps_cap: 60
  mirror: true

tracker:
  model_path: "models/hand_landmarker.task"
  delegate: "CPU"                      # XNNPACK NEON (0 leak, 14ms on M1 Pro; avoids macOS MediaPipe GPU IOSurface leak)
  num_hands: 2                         # Full 2-hand parity (Left+Right Palm Wheel + 2-Hand Zoom)
  min_hand_detection_confidence: 0.55
  min_hand_presence_confidence: 0.55
  min_tracking_confidence: 0.55

hand:
  cursor_hand: "Right"                 # "Right" | "Left" | "Both"
  click_hand: "Right"                  # "Right" | "Left" | "Both" | "Same"
  gesture_preset: "airpoint"           # "airpoint" | "classic" | "custom"

gestures:
  enable_click: true
  enable_right_click: true
  enable_grab: true
  enable_scroll: true
  enable_window_tile: true
  enable_spaces_nav: true
  enable_dictation: true
  enable_zoom: true
  zoom_speed: 1.0
  zoom_pose: "thumb_index_pinch"       # Dedicated 2-hand zoom pose (arbitrated cleanly against dictation)
  zoom_hold_ms: 120                    # Both hands must hold zoom pose >= 120 ms before zooming
  zoom_arbitration_ms: 300             # Window (ms) where 2nd hand entering zoom cancels/suppresses dictation
  dictation_arm_ms: 350                # Single-hand hold duration (200..800 ms) required to arm dictation
  dictation_priority_ms: 1000          # Once dictation runs >= 1000 ms, ignore incidental 2nd-hand zoom until end
  latch_gate_while_pose_active: true   # Keep classifying active pose even if hand tilts past dirZ gate

smoothing:
  enable_landmark_smoothing: true
  landmark_min_cutoff: 2.0             # Fast Stage-1 OneEuro (Airpoint default)
  landmark_beta: 45.0                  # Low lag during rapid finger movement
  landmark_d_cutoff: 1.0
  landmark_exclude_joints: []          # Optional landmark indices to bypass smoothing
  gap_reset_ms: 100.0                  # AM-7 filter reset on camera hiccup >= 100ms

cursor:
  display: "cursor"                    # "cursor" (active display) | "main" | "all"
  enable_filter: true
  filter_min_cutoff: 1.0               # Stage-2 OneEuro on cursor output
  filter_beta: 0.01
  filter_d_cutoff: 1.0
  pointer_sensitivity: 2.2             # Relative gain multiplier
  pointer_acceleration: 1.4            # Speed-adaptive acceleration boost
  enable_distance_compensation: true
  reference_palm_size: 0.10            # Normalized wrist->middle_mcp reference
  max_jump_ratio: 0.15                 # Reject single-frame jump > 15% screen width
  enable_lerp_60hz: true               # Interpolate 30Hz webcam to smooth 60Hz cursor
  adaptive_lerp: true                  # Ramp lerp_speed smoothly from 40 (slow) to 70 (fast)
  lerp_speed: 55.0
  lerp_rate_hz: 60.0
  click_lookback_ms: 90.0              # Anchor click to pre-pinch fingertip position (90 ms earlier)
  click_lookback_max_speed_px_s: 250.0 # Ignore lookback if pointer speed at lookback target > 250 px/s
  click_lookback_max_offset_px: 24.0   # Clamp lookback anchor offset to <= 24 px from live pointer
  click_dwell_lock_ms: 120.0           # Freeze pointer up to 120 ms while click probability rises > 0.4
  click_dwell_lock_cooldown_ms: 400.0  # Cooldown (ms) after an expired dwell lock before re-arming
  drag_lookback_ms: 60.0               # Anchor drag start & right-click to pre-pinch position (60 ms earlier)
  drag_dwell_lock_ms: 80.0             # Brief stabilization lock before drag start (released on grab_just_started)
  deadzone_px: 0.35                    # Micro-jitter floor
  reacquire_skip_frames: 2             # Ignore first 2 frames after hand reappears
  enable_pointing_gate: true
  pointing_forward_z_threshold: -0.15  # (LM8 - LM0).z / len must point toward screen
  pointing_gate_hysteresis: 0.04       # Exit threshold = threshold + hysteresis (-0.11)
  virtual_canvas_width: 1920
  virtual_canvas_height: 1080

classifier:
  mode: "heuristic"                    # "heuristic" | "shadow" | "veto" | "onnx"
  backend: "heuristic_3d"              # Legacy alias: "heuristic_3d" | "onnx_tcn"
  onnx_model_path: "models/aerohand_tcn.onnx"
  onnx_normalizer_path: "models/aerohand_tcn_normalizer.json"
  sequence_length: 5
  feature_set: "invariant348"          # "invariant348" | "airmouse885"
  shadow_mode: false                   # Legacy alias for mode="shadow"
  veto_min_prob: 0.35                  # In veto mode: veto if ONNX prob(proposed_pose) < 0.35
  veto_idle_prob: 0.60                 # In veto mode: veto if ONNX prob(idle) > 0.60
  veto_scope: "entry"                  # "entry" (only first veto_entry_window_ms) | "always"
  veto_entry_window_ms: 300.0          # Window (ms) after heuristic rising edge where ONNX may veto
  veto_confirm_frames: 3               # Consecutive ready ONNX approval frames required to accept an entry
  veto_on_error: "pass_through"        # "pass_through" (preserve heuristic on ONNX error) | "idle"
  max_onnx_p95_ms: 8.0                 # Auto-fallback to heuristic if ONNX p95 latency > 8ms
  heuristic_3d:
    pinch_on_dist: 0.34
    pinch_off_dist: 0.62
    pinky_base_on_dist: 0.42
    pinky_base_off_dist: 0.72
    dual_pinch_on_dist: 0.38
    dual_pinch_off_dist: 0.65
    min_margin: 0.08
    require_pointing_gate_for_actions: true
    enable_approach_gate: true         # Require separated -> closed approach before new pinch entry
    approach_window_ms: 1500.0         # Window (ms) in which pair must have been seen open
    approach_open_margin: 0.04         # Distance above pinch_on_dist counting as open/poised
    approach_decay_tau_ms: 400.0       # Time constant (ms) for FPS-independent open-dist decay
    enable_posture_gate: true          # Require extended index finger for middle/ring/pinky clicks
    index_ext_min: 1.25                # Min ||index_tip-wrist|| / ||index_mcp-wrist|| ratio
    enable_motion_gate: true           # Reject new pinch entries during fast wrist motion/rotation
    max_wrist_speed: 0.18              # Legacy screen-units/s fallback when palm_width_2d unavailable
    max_wrist_speed_pw: 1.50           # Max palm-width-normalized wrist speed (palm-widths/s)
    motion_ema_tau_ms: 32.0            # Time constant (ms) for FPS-independent velocity EMA (~0.65 at 30fps)
    max_wrist_ang_speed_deg_s: 95.0    # Max 3D palm angular speed (deg/s) on new pinch entry
    enable_grip_guard: true            # Suppress loose contact when >= 3 fingers are half-curled
    grip_half_curled_min: 3
    grip_loose_ratio: 1.05
    fist_guard_requires_index_curled: true  # Block fist with thumb touching curled index tip (dist_to_palm < 0.72)
    fist_guard_protect_latch_ms: 500.0      # Keep long-held latches (>= 500 ms) alive even if all 4 fingers curl
    enable_airpoint_shaft_press: true       # Support Airpoint curled-finger shaft presses (1-3 ext) + relaxed palm-tuck (4 ext)
    shaft_on_dist: 0.29                     # Thumb-to-curled-finger PIP-DIP-TIP shaft contact threshold
    shaft_off_dist: 0.48                    # Release threshold for curled-finger shaft press
    shaft_open_dist: 0.52                   # Required prior open separation before shaft press (anti-jitter)
    shaft_eligibility_grace_frames: 3       # Grace frames for transient finger-extension flaps while latched on shaft
    shaft_grace_min_latch_age_ms: 200.0     # Require established shaft hold (>= 200 ms) before applying eligibility grace
    index_shaft_on_dist: 0.24               # Thumb-to-index-side PIP-DIP-TIP contact threshold (dictation)
    index_shaft_off_dist: 0.42
    index_shaft_open_dist: 0.60
    palm_tuck_on_dist: 0.44                 # Relaxed thumb-in-palm distance (4 fingers slightly extended/curved -> spaces_nav)
    palm_tuck_off_dist: 0.66
    palm_tuck_open_dist: 0.72
    spaces_nav_palm_facing_min: 0.55        # Upright open-palm facing dot allowing spaces_nav when fingers point upward
    spaces_nav_max_wrist_speed_pw: 4.2      # Relaxed wrist speed ceiling for upright 4-finger tuck-and-swipe
    spaces_nav_max_wrist_ang_deg_s: 240.0   # Relaxed palm angular speed ceiling for upright 4-finger tuck-and-swipe

collector:
  subject: "minh"                      # Default collector subject ID (matches converted corpus & primary_subject)
  record_hand: "primary"               # "primary" | "both"
  quality_gate_mode: "clean"           # "clean" (drop bad frames, split gaps, always save) | "strict"
  trim_edge_ms: 300                    # Trim first/last 300 ms of guided recording segments
  countdown_s: 3.0                     # Pre-step countdown for guided protocol
  step_duration_s: 5.0                 # Default capture duration per guided step
  negatives_dir: "data/negatives"      # Hard-negative snapshots saved via "Not intended"
  recall_dir: "data/recall"            # Cued event-level recall sessions (excluded from train/FT replay)
  negative_window_s: 3.0               # Capture +/- 1.5s around the last false trigger

eval:
  min_exposure_hours: 1.5              # Minimum hand-present idle hours for sealed FT UCB claims
  ft_tiers:
    A:
      triggers: ["left_click", "right_click", "drag_start", "window_tile", "spaces_nav", "palm_wheel"]
      max_ucb_per_hour: 2.0            # High-impact actions: 0 events allowed at 1.5h (95% Garwood UCB)
    B:
      triggers: ["scroll_stroke"]
      max_ucb_per_hour: 6.0            # Reversible scroll strokes: <= 3 events allowed at 1.5h
    C:
      triggers: ["dictation_start"]
      max_ucb_per_hour: 6.0            # Dictation arming (protected by RMS/duration filter): <= 3 at 1.5h

pose_state_machine:
  pose_hold_threshold_ms: 180
  pose_hold_motion_threshold_px: 15.0
  still_right_click_motion_px: 38.0      # Net displacement ceiling distinguishing still right-click from 2D scroll
  click_debounce_ms: 200
  enable_click_debounce: true
  enable_click_hold: false             # true = hold click pose to drag (classic style)
  double_click_window_ms: 350
  thresholds:
    thumb_index_pinch:
      enter_threshold: 0.82
      exit_threshold: 0.30
      enter_frames: 3
      exit_frames: 2
    thumb_middle_pinch:
      enter_threshold: 0.75
      exit_threshold: 0.25
      enter_frames: 2
      exit_frames: 2
    thumb_ring_pinch:
      enter_threshold: 0.75
      exit_threshold: 0.45
      enter_frames: 2
      exit_frames: 5
    thumb_index_middle_pinch:
      enter_threshold: 0.75
      exit_threshold: 0.45
      enter_frames: 2
      exit_frames: 4
    thumb_pinky_pinch:
      enter_threshold: 0.75
      exit_threshold: 0.30
      enter_frames: 2
      exit_frames: 2
    thumb_pinky_base:
      enter_threshold: 0.75
      exit_threshold: 0.30
      enter_frames: 2
      exit_frames: 2
  tap_actions:
    thumb_middle_pinch: "left_click"
  hold_actions:
    thumb_ring_pinch: "scroll"         # Still (< 15px) on release -> right_click; move -> scroll
    thumb_index_middle_pinch: "drag"
    thumb_index_pinch: "dictation"     # Hold to dictate (vi-VN / en-US), release to insert text
    thumb_pinky_pinch: "window_tile"
    thumb_pinky_base: "spaces_nav"

scroll:
  enabled: true
  speed: 1.0
  deadzone: 1.0
  enable_axis_lock: true
  axis_lock_distance: 15.0
  axis_lock_ratio: 2.0
  breakout_threshold: 8.0
  enable_inertia: true
  inertia_friction: 0.95
  min_inertia_speed: 5.0
  natural_scrolling: true
  use_phases: true                     # Emits native macOS ScrollPhase + MomentumPhase

spaces_nav:
  enabled: true
  lock_threshold_px: 8.0
  sensitivity_px: 20.0
  invert: true
  cooldown_ms: 450

window_tile:
  enabled: true
  animate: true
  lock_threshold_px: 8.0
  sensitivity_px: 20.0
  cooldown_ms: 450

palm_wheel:
  enabled: true
  enabled_hands:
    Left: true
    Right: true
  activation_hold_ms: 350              # Hardened hold duration to suppress hair/stretch FA
  max_activation_motion_norm: 0.035    # Reset hold timer if palm moves rapidly
  press_down_threshold: 0.95
  press_up_threshold: 1.10
  cylinder_radius_multiplier: 0.50
  palm_facing_dot_threshold: 0.60
  palm_facing_dot_hysteresis: 0.05
  open_palm_grace_ms: 100
  confirmation_hold_ms: 200
  confirmation_grace_ms: 200
  cooldown_ms: 300
  bindings:
    Right:
      thumb:
        type: "submenu"
        label: "Tracking"
        icon: "pointer"
        items:
          thumb: "toggle_pause"
          index: "recenter"
          middle: "show_main_window"
          ring: "toggle_camera_hud"
          pinky: "submenu_back"
      index: "mission_control"
      middle: "spotlight"
      ring: "dictation_toggle"
      pinky:
        type: "submenu"
        label: "Player"
        icon: "play"
        items:
          thumb: "submenu_back"
          index: "media_prev"
          middle: "media_play_pause"
          ring: "media_next"
          pinky:
            type: "submenu"
            label: "Volume"
            icon: "volume"
            items:
              thumb: "submenu_back"
              index: "volume_down"
              middle: "volume_mute"
              ring: "volume_up"
              pinky: "unassigned"
    Left:
      thumb: "siri_listen"
      index:
        type: "submenu"
        label: "Window"
        icon: "window"
        items:
          thumb: "window_hide"
          index: "window_fullscreen"
          middle: "window_minimize"
          ring: "window_close"
          pinky: "submenu_back"
      middle:
        type: "submenu"
        label: "Edit"
        icon: "edit"
        items:
          thumb: "edit_paste"
          index: "edit_copy"
          middle: "edit_cut"
          ring: "edit_redo"
          pinky: "edit_undo"
      ring:
        type: "submenu"
        label: "Apps"
        icon: "apps"
        items:
          thumb: "open_app:/System/Library/CoreServices/Finder.app"
          index: "open_app:/Applications/Safari.app"
          middle: "open_app:/System/Applications/Notes.app"
          ring: "open_app:/System/Applications/Utilities/Terminal.app"
          pinky: "submenu_back"
      pinky: "keyboard_emoji"

dictation:
  enabled: true
  engine: "auto"                       # "auto" (Apple Speech -> mlx_whisper -> macOS Dictation)
  language: "vi-VN"                    # "vi-VN" | "en-US"
  paste_mode: "clipboard"              # UTF-8 safe clipboard paste & restore (no Telex corruption)
  max_duration_s: 30.0
  min_duration_s: 0.6                  # Discard accidental clips shorter than 0.6s
  min_rms: 0.01                        # Discard silent clips with peak frame RMS < 0.01
  min_voiced_ms: 250                   # Require >= 250 ms of voiced frames above min_rms
  hallucination_blocklist:             # Common local Whisper silence hallucinations (exact normalized match)
    vi-VN:
      - "hãy subscribe cho kênh ghiền mì gõ để không bỏ lỡ những video hấp dẫn"
      - "cảm ơn các bạn đã theo dõi và hẹn gặp lại"
      - "cảm ơn đã xem video"
      - "đăng ký kênh"
      - "nhớ đăng ký kênh nhé"
      - "phụ đề bởi"
    en-US:
      - "thank you for watching"
      - "thanks for watching"
      - "please subscribe"
      - "subtitles by"
      - "you"

audio:
  enabled: true
  muted: false
  volume: 0.50
  click_down_sound: "assets/sounds/click_down.wav"
  click_up_sound: "assets/sounds/click_up.wav"
  wheel_tick_sound: "assets/sounds/wheel_tick.wav"

api:
  enabled: true
  host: "127.0.0.1"
  port: 17420

hotkeys:
  enabled: true
  toggle_pause: "cmd+shift+a"
  recenter: "cmd+shift+r"
  toggle_hud: "cmd+shift+h"
  mark_not_intended: "cmd+shift+n"     # Save +/- 1.5s landmarks clip as hard-negative `idle`
  mark_deliberate_gesture: "cmd+ctrl+opt+m"  # Passive dogfood ONLY: mark deliberate gesture (+/-1.5s excluded)

system:
  launch_at_login: false
  multi_monitor: true

runtime:
  idle_throttle_enabled: true
  idle_timeout_s: 3.0
  idle_fps: 8.0
  max_drag_duration_ms: 20000
  hand_lost_release_ms: 350
  camera_stall_release_ms: 500

typing_guard:
  enabled: true
  source: "counter"                    # Zero Input Monitoring permission required
  own_post_margin_ms: 50
  keyboard_ms: 1500
  mouse_ms: 1000
  keyboard_blocks: ["pointer", "click", "drag", "scroll", "swipe", "window_tile", "zoom"]
  mouse_blocks: ["pointer", "click", "drag", "scroll"]

profiles:
  enabled: true
  apps:
    com.microsoft.VSCode:
      name: "VS Code"
      scroll:
        speed: 1.2
    com.apple.Safari:
      name: "Safari"
      scroll:
        speed: 1.15
    com.apple.iWork.Keynote:
      name: "Keynote"
      cursor:
        pointer_sensitivity: 1.8
