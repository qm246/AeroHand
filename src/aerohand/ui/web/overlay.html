<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AeroHand Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: transparent !important;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    color: #f8fafc;
    pointer-events: none;
  }

  /* 1. Window Tile Frosted Glass Ghost Preview */
  #tile-preview {
    position: fixed;
    z-index: 4000;
    border-radius: 16px;
    background: rgba(56, 189, 248, 0.16);
    border: 2px solid rgba(96, 165, 250, 0.78);
    box-shadow: 0 0 36px rgba(56, 189, 248, 0.25), inset 0 0 24px rgba(45, 212, 191, 0.14);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.97);
    transition: opacity 120ms ease, transform 120ms ease, left 100ms ease, top 100ms ease, width 100ms ease, height 100ms ease;
  }
  #tile-preview.visible { opacity: 1; transform: scale(1); }
  #tile-preview .tile-badge {
    padding: 8px 18px; border-radius: 999px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(96, 165, 250, 0.55);
    font-size: 14px; font-weight: 600; letter-spacing: 0.2px; color: #e0f2fe;
  }

  /* 2. Click Pulse Ripples */
  .pulse-ring {
    position: fixed;
    width: 34px; height: 34px;
    border-radius: 9999px;
    border: 2.5px solid #2dd4bf;
    box-shadow: 0 0 14px rgba(45, 212, 191, 0.55);
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0.92;
    animation: pulseExpand 360ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .pulse-ring.right_click { border-color: #fbbf24; box-shadow: 0 0 14px rgba(251, 191, 36, 0.55); }
  .pulse-ring.grab { border-color: #60a5fa; box-shadow: 0 0 14px rgba(96, 165, 250, 0.55); }
  .pulse-ring.double_click { border-color: #34d399; border-width: 3px; }
  @keyframes pulseExpand {
    to { transform: translate(-50%, -50%) scale(2.15); opacity: 0; }
  }

  /* 3. Top Glass Toast (Gesture Hints, Dictation Waveform & Tracking Warnings) */
  #toast-stack {
    position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
    z-index: 9999;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .toast-pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-radius: 9999px;
    background: rgba(12, 17, 28, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-size: 13px; font-weight: 500; color: #f1f5f9;
    opacity: 0; transform: translateY(-6px);
    transition: opacity 140ms ease, transform 140ms ease;
  }
  .toast-pill.visible { opacity: 1; transform: translateY(0); }
  .toast-pill.warning { border-color: rgba(251, 191, 36, 0.55); color: #fef3c7; }
  .toast-pill.dictation { border-color: rgba(192, 132, 252, 0.65); color: #f3e8ff; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: #2dd4bf; }
  .toast-pill.warning .dot { background: #fbbf24; }
  .toast-pill.dictation .dot { background: #c084fc; animation: blink 0.9s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .wave-bar {
    width: 3px; border-radius: 2px; background: #c084fc;
    transition: height 60ms linear;
  }

  /* 4. On-Screen 5-Petal Palm Wheel Radial Menu */
  #palm-wheel-layer { position: fixed; inset: 0; z-index: 5000; }
  .pw-root {
    position: fixed;
    transform: translate(-50%, -50%);
    width: 320px; height: 320px;
    display: flex; align-items: center; justify-content: center;
  }
  .pw-ring-svg {
    position: absolute; width: 104px; height: 104px;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.45));
  }
  .pw-center {
    position: relative; z-index: 2;
    width: 82px; height: 82px; border-radius: 999px;
    background: rgba(12, 18, 30, 0.88);
    border: 1.5px solid rgba(45, 212, 191, 0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 4px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  .pw-hand-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #2dd4bf; }
  .pw-crumb { font-size: 11px; font-weight: 600; color: #f8fafc; margin-top: 2px; max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pw-petal {
    position: absolute;
    min-width: 104px; max-width: 126px;
    padding: 8px 11px; border-radius: 14px;
    background: rgba(14, 20, 34, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transform: translate(-50%, -50%) scale(0.95);
    transition: transform 90ms ease, border-color 90ms ease, background 90ms ease;
  }
  .pw-petal.selected {
    transform: translate(-50%, -50%) scale(1.1);
    background: rgba(45, 212, 191, 0.24);
    border-color: #2dd4bf;
    box-shadow: 0 0 24px rgba(45, 212, 191, 0.45);
  }
  .pw-petal.confirmed {
    transform: translate(-50%, -50%) scale(1.16);
    background: rgba(52, 211, 153, 0.36);
    border-color: #34d399;
  }
  .pw-petal.empty { opacity: 0.35; }
  .pw-finger-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #94a3b8; }
  .pw-slot-label { font-size: 12px; font-weight: 600; color: #f8fafc; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
  .pw-sub-badge { font-size: 9px; color: #60a5fa; font-weight: 600; }

  /* 5. ML Studio Floating Teleprompter Recording Guide (Top-Center, Right Below Webcam) */
  #collector-guide {
    display: none;
    width: min(760px, 88vw);
    padding: 20px 28px 18px;
    border-radius: 22px;
    background: rgba(10, 15, 28, 0.92);
    border: 2.5px solid rgba(45, 212, 191, 0.72);
    box-shadow: 0 18px 54px rgba(0, 0, 0, 0.62), 0 0 36px rgba(45, 212, 191, 0.22);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    color: #f8fafc;
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }
  #collector-guide.visible { display: block; }
  #collector-guide.state-rec {
    border-color: rgba(251, 113, 133, 0.92);
    box-shadow: 0 18px 54px rgba(0, 0, 0, 0.65), 0 0 42px rgba(251, 113, 133, 0.34);
  }
  #collector-guide.state-cue {
    border-color: rgba(251, 191, 36, 0.95);
    box-shadow: 0 18px 54px rgba(0, 0, 0, 0.65), 0 0 46px rgba(251, 191, 36, 0.36);
  }
  #collector-guide.state-done {
    border-color: rgba(52, 211, 153, 0.92);
    box-shadow: 0 18px 54px rgba(0, 0, 0, 0.62), 0 0 38px rgba(52, 211, 153, 0.30);
  }
  .cg-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .cg-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cg-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.45px; text-transform: uppercase;
    background: rgba(45, 212, 191, 0.18); color: #5eead4;
    border: 1px solid rgba(45, 212, 191, 0.40);
  }
  #collector-guide.state-rec .cg-pill.main {
    background: rgba(251, 113, 133, 0.24); color: #fda4af; border-color: rgba(251, 113, 133, 0.55);
  }
  #collector-guide.state-cue .cg-pill.main {
    background: rgba(251, 191, 36, 0.24); color: #fde68a; border-color: rgba(251, 191, 36, 0.60);
  }
  #collector-guide.state-done .cg-pill.main {
    background: rgba(52, 211, 153, 0.24); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.55);
  }
  .cg-pill.dry {
    background: rgba(251, 191, 36, 0.20); color: #fcd34d; border-color: rgba(251, 191, 36, 0.50);
  }
  .cg-pill.step {
    background: rgba(255, 255, 255, 0.09); color: #e2e8f0; border-color: rgba(255, 255, 255, 0.18);
  }
  .cg-meta {
    font-size: 13px; font-weight: 600; color: #94a3b8;
  }
  .cg-dot {
    width: 10px; height: 10px; border-radius: 999px; background: #2dd4bf;
  }
  #collector-guide.state-rec .cg-dot { background: #fb7185; animation: blink 0.8s infinite; }
  #collector-guide.state-cue .cg-dot { background: #fbbf24; animation: blink 0.65s infinite; }
  #collector-guide.state-done .cg-dot { background: #34d399; animation: none; }
  .cg-body {
    display: flex; align-items: center; justify-content: space-between; gap: 22px;
  }
  .cg-text { flex: 1; min-width: 0; }
  .cg-title {
    font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -0.4px;
    color: #ffffff; margin-bottom: 6px;
  }
  #collector-guide.state-cue .cg-title { color: #fef08a; }
  .cg-sub {
    font-size: 19px; font-weight: 500; line-height: 1.35; color: #e2e8f0;
  }
  .cg-timer {
    font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: -1px; color: #5eead4; min-width: 104px; text-align: right;
  }
  #collector-guide.state-rec .cg-timer { color: #fda4af; }
  #collector-guide.state-cue .cg-timer { color: #fde047; }
  #collector-guide.state-done .cg-timer { color: #6ee7b7; font-size: 36px; }
  .cg-progress-track {
    margin-top: 14px; height: 8px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.12); overflow: hidden;
  }
  .cg-progress-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, #2dd4bf, #60a5fa);
    transition: width 80ms linear;
  }
  #collector-guide.state-rec .cg-progress-fill { background: linear-gradient(90deg, #fb7185, #f43f5e); }
  #collector-guide.state-cue .cg-progress-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  #collector-guide.state-done .cg-progress-fill { background: linear-gradient(90deg, #34d399, #10b981); width: 100%; }
  .cg-footer {
    margin-top: 12px; display: flex; align-items: center; justify-content: space-between;
    gap: 14px; font-size: 14px; font-weight: 600; color: #cbd5e1; flex-wrap: wrap;
  }
  .cg-hand-ok { color: #6ee7b7; }
  .cg-hand-miss { color: #fbbf24; font-weight: 700; }
  .cg-next { color: #94a3b8; font-weight: 500; }
</style>
</head>
<body>
  <div id="tile-preview"><div class="tile-badge" id="tile-badge"></div></div>
  <div id="toast-stack">
    <div id="collector-guide">
      <div class="cg-top">
        <div class="cg-badges">
          <span class="cg-pill main"><span class="cg-dot"></span><span id="cg-mode-lbl"></span></span>
          <span class="cg-pill dry" id="cg-dry-pill" style="display:none">DRY-RUN</span>
          <span class="cg-pill step" id="cg-step-pill"></span>
        </div>
        <div class="cg-meta" id="cg-meta-lbl"></div>
      </div>
      <div class="cg-body">
        <div class="cg-text">
          <div class="cg-title" id="cg-title"></div>
          <div class="cg-sub" id="cg-sub"></div>
        </div>
        <div class="cg-timer" id="cg-timer"></div>
      </div>
      <div class="cg-progress-track" id="cg-prog-wrap"><div class="cg-progress-fill" id="cg-prog-fill"></div></div>
      <div class="cg-footer">
        <span id="cg-hand-status"></span>
        <span class="cg-next" id="cg-next-lbl"></span>
      </div>
    </div>
    <div id="hint-toast" class="toast-pill"><span class="dot"></span><span id="hint-text"></span></div>
    <div id="dict-toast" class="toast-pill dictation">
      <span class="dot"></span>
      <span id="dict-text"></span>
      <div style="display:flex;align-items:center;gap:2px;height:16px" id="dict-bars">
        <div class="wave-bar" style="height:4px"></div>
        <div class="wave-bar" style="height:8px"></div>
        <div class="wave-bar" style="height:12px"></div>
        <div class="wave-bar" style="height:6px"></div>
      </div>
    </div>
    <div id="warn-toast" class="toast-pill warning"><span class="dot"></span><span id="warn-text"></span></div>
  </div>
  <div id="palm-wheel-layer"></div>

<script>
  let lastClickSeq = 0;
  let HAS_HYDRATED = false;
  let CACHED_UI = {
    language: "vi",
    show_click_feedback: true,
    show_palm_wheel_overlay: true,
    palm_wheel_fixed: false,
    show_window_tile_preview: true,
    show_collector_overlay: true,
    enable_tracking_warnings: true,
    hints: {},
  };
  let CACHED_I18N = {};

  function notifyHost(action) {
    try {
      window.webkit.messageHandlers.aerohand.postMessage({ action });
    } catch (_e) {}
  }

  const FINGER_NAMES_VI = { thumb: "Ngón cái", index: "Ngón trỏ", middle: "Ngón giữa", ring: "Áp út", pinky: "Ngón út" };
  const FINGER_NAMES_EN = { thumb: "Thumb", index: "Index", middle: "Middle", ring: "Ring", pinky: "Pinky" };

  // Fan petal angles (degrees, -90 = top) for Right and Left hands
  const ANGLES_RIGHT = { thumb: 160, index: -135, middle: -90, ring: -45, pinky: 20 };
  const ANGLES_LEFT  = { pinky: 160, ring: -135, middle: -90, index: -45, thumb: 20 };

  function spawnPulse(ev) {
    const el = document.createElement("div");
    el.className = "pulse-ring " + (ev.kind || "left_click");
    el.style.left = ev.x + "px";
    el.style.top = ev.y + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 400);
  }

  function renderPalmWheels(wheels, cfg, i18n, lang) {
    const layer = document.getElementById("palm-wheel-layer");
    if (!cfg.show_palm_wheel_overlay || !wheels || wheels.length === 0) {
      if (layer.childElementCount > 0) layer.innerHTML = "";
      return;
    }

    const fingerMap = lang === "en" ? FINGER_NAMES_EN : FINGER_NAMES_VI;
    const actLabels = (i18n && i18n.actions) || {};
    let html = "";

    for (const pw of wheels) {
      let cx = window.innerWidth * 0.5;
      let cy = window.innerHeight * 0.5;
      if (!cfg.palm_wheel_fixed && pw.palm_center) {
        cx = Math.max(185, Math.min(window.innerWidth - 185, pw.palm_center[0] * window.innerWidth));
        cy = Math.max(185, Math.min(window.innerHeight - 185, pw.palm_center[1] * window.innerHeight));
      }

      const prog = Math.max(0, Math.min(1, pw.progress || 0));
      const dash = 289.0;
      const offset = dash * (1 - prog);
      const ringCol = pw.state === "active" ? "#2dd4bf" : (pw.state === "confirmed" ? "#34d399" : "#fbbf24");
      const crumb = pw.menu_label ? (actLabels[pw.menu_label] || pw.menu_label) : (pw.hand === "Left" ? (lang === "en" ? "LEFT" : "TRÁI") : (lang === "en" ? "RIGHT" : "PHẢI"));
      const handTag = pw.hand === "Left" ? (lang === "en" ? "LEFT PALM" : "TAY TRÁI") : (lang === "en" ? "RIGHT PALM" : "TAY PHẢI");

      html += `<div class="pw-root" style="left:${cx}px;top:${cy}px">`;
      html += `<svg class="pw-ring-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"/>
        <circle cx="50" cy="50" r="46" fill="none" stroke="${ringCol}" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${offset}"
          transform="rotate(-90 50 50)"/>
      </svg>`;
      html += `<div class="pw-center"><div class="pw-hand-tag">${handTag}</div><div class="pw-crumb">${crumb}</div></div>`;

      if (pw.state === "active" || pw.state === "confirmed") {
        const angles = pw.hand === "Left" ? ANGLES_LEFT : ANGLES_RIGHT;
        const radius = 122;
        for (const slot of (pw.slots || [])) {
          const deg = angles[slot.finger] ?? -90;
          const rad = deg * Math.PI / 180;
          const px = 160 + Math.cos(rad) * radius;
          const py = 160 + Math.sin(rad) * radius;
          const isSel = pw.selected_finger === slot.finger;
          const cls = "pw-petal"
            + (slot.id === "unassigned" ? " empty" : "")
            + (isSel ? (pw.state === "confirmed" ? " confirmed" : " selected") : "");
          const lbl = actLabels[slot.label] || actLabels[slot.id] || slot.label || "—";
          html += `<div class="${cls}" style="left:${px}px;top:${py}px">
            <div class="pw-finger-tag">${fingerMap[slot.finger] || slot.finger}</div>
            <div class="pw-slot-label">${lbl}</div>
            ${slot.is_submenu ? `<div class="pw-sub-badge">▸ ${lang === "en" ? "Submenu" : "Menu con"}</div>` : ""}
          </div>`;
        }
      }
      html += `</div>`;
    }
    layer.innerHTML = html;
  }

  window.updateOverlay = function(payload) {
    const snap = payload.snap || {};
    if (payload.i18n) CACHED_I18N = payload.i18n;
    if (payload.ui) {
      CACHED_UI = Object.assign({}, CACHED_UI, payload.ui);
      HAS_HYDRATED = true;
    }
    if (payload.ui_delta) CACHED_UI = Object.assign({}, CACHED_UI, payload.ui_delta);
    if (!HAS_HYDRATED) notifyHost("overlay_need_sync");
    const ui = CACHED_UI;
    const i18n = CACHED_I18N;
    const lang = (ui && ui.language) || "vi";

    // 1. Click pulse ripple
    if (ui.show_click_feedback && snap.click_event && snap.click_event_seq > lastClickSeq) {
      lastClickSeq = snap.click_event_seq;
      spawnPulse(snap.click_event);
    }

    // 2. Window Tile Ghost Preview
    const tileEl = document.getElementById("tile-preview");
    const tileBadge = document.getElementById("tile-badge");
    if (ui.show_window_tile_preview && snap.window_tile_preview) {
      const r = snap.window_tile_preview;
      tileEl.style.left = r.x + "px";
      tileEl.style.top = r.y + "px";
      tileEl.style.width = r.w + "px";
      tileEl.style.height = r.h + "px";
      tileBadge.textContent = (i18n.tile_dirs && i18n.tile_dirs[r.direction]) || r.direction;
      tileEl.classList.add("visible");
    } else {
      tileEl.classList.remove("visible");
    }

    // 3. Gesture Hint Toast (reads dynamic live gesture-map text)
    const hintEl = document.getElementById("hint-toast");
    const hintKey = snap.active_hint;
    const hintsCfg = (ui && ui.hints) || {};
    if (hintKey && hintKey !== "dictation" && (hintsCfg[hintKey] !== false)) {
      document.getElementById("hint-text").textContent =
        snap.active_hint_text || (i18n.hints && i18n.hints[hintKey]) || hintKey;
      hintEl.classList.add("visible");
    } else {
      hintEl.classList.remove("visible");
    }

    // 4. Dictation live waveform pill (or brief discard toast)
    const dictEl = document.getElementById("dict-toast");
    const dictBars = document.getElementById("dict-bars");
    const d = snap.dictation || {};
    if (d.recording || d.transcribing) {
      const txt = d.recording
        ? ((i18n.hints && i18n.hints.dictation) || "Listening...") + ` (${d.language || "vi-VN"})`
        : (lang === "en" ? "Transcribing speech..." : "Đang chuyển giọng nói thành văn bản...");
      document.getElementById("dict-text").textContent = txt;
      if (dictBars) dictBars.style.display = "flex";
      const lvl = Math.max(0.15, Math.min(1, d.audio_level || 0.2));
      const bars = dictBars.children;
      const mults = [0.6, 1.0, 0.85, 0.5];
      for (let i = 0; i < bars.length; i++) {
        bars[i].style.height = Math.round(4 + 12 * lvl * mults[i]) + "px";
      }
      dictEl.classList.add("visible");
    } else if (d.discard_active && d.last_discard_reason) {
      const notices = (i18n && i18n.dictation_notices) || {};
      const reasonKey = d.last_discard_reason === "two_hand_zoom"
        ? "cancelled_zoom"
        : ("discarded_" + d.last_discard_reason);
      const fallbackTxt = lang === "en" ? "Discarded (too short / silent)" : "Đã bỏ (quá ngắn / không có tiếng)";
      document.getElementById("dict-text").textContent = notices[reasonKey] || fallbackTxt;
      if (dictBars) dictBars.style.display = "none";
      dictEl.classList.add("visible");
    } else {
      dictEl.classList.remove("visible");
    }

    // 5. Tracking Warning Toast
    const warnEl = document.getElementById("warn-toast");
    if (ui.enable_tracking_warnings && snap.warning && snap.warning.code) {
      document.getElementById("warn-text").textContent =
        (i18n.warnings && i18n.warnings[snap.warning.code]) || snap.warning.code;
      warnEl.classList.add("visible");
    } else {
      warnEl.classList.remove("visible");
    }

    // 6. On-Screen Palm Wheel Radial Menu
    renderPalmWheels(snap.palm_wheels, ui, i18n, lang);

    // 7. ML Studio Floating Teleprompter Recording Guide
    renderCollectorGuide(snap.collector_guide, ui, i18n, lang);
  };

  function renderCollectorGuide(cg, ui, i18n, lang) {
    const root = document.getElementById("collector-guide");
    if (!root) return;
    if (!cg || ui.show_collector_overlay === false) {
      root.className = "";
      return;
    }
    const isVi = lang !== "en";
    const colI18n = (i18n && i18n.collector) || {};
    const poses = (i18n && i18n.poses) || {};
    const meta = cg.session_meta || {};
    const guided = cg.guided || {};
    const cued = cg.cued || {};

    const modeEl = document.getElementById("cg-mode-lbl");
    const dryEl = document.getElementById("cg-dry-pill");
    const stepEl = document.getElementById("cg-step-pill");
    const metaEl = document.getElementById("cg-meta-lbl");
    const titleEl = document.getElementById("cg-title");
    const subEl = document.getElementById("cg-sub");
    const timerEl = document.getElementById("cg-timer");
    const progWrap = document.getElementById("cg-prog-wrap");
    const progFill = document.getElementById("cg-prog-fill");
    const handEl = document.getElementById("cg-hand-status");
    const nextEl = document.getElementById("cg-next-lbl");

    const angleTxt = (meta.wrist_angle || "0") + "°";
    const distMapVi = { near: "Gần", mid: "Vừa", far: "Xa" };
    const lightMapVi = { bright: "Đủ sáng", backlit: "Nghịch sáng", dim: "Thiếu sáng" };
    const distTxt = isVi ? (distMapVi[meta.distance] || meta.distance || "Vừa") : (meta.distance || "mid");
    const lightTxt = isVi ? (lightMapVi[meta.lighting] || meta.lighting || "Đủ sáng") : (meta.lighting || "bright");
    const handPref = cued.active ? (cued.hand || meta.hand || "Right") : (meta.hand || "Right");
    metaEl.textContent = `${handPref} • ${angleTxt} • ${distTxt} • ${lightTxt}`;

    if (cg.hands_count > 0 && cg.hand) {
      handEl.className = "cg-hand-ok";
      const okLbl = colI18n.ov_hand_ok || (isVi ? "Đã thấy tay" : "Hand visible");
      const inCued = !!(cued.active || (cued.phase === "done" && cued.has_unsaved));
      const shownCnt = inCued ? (cued.samples || 0) : (cg.total || 0);
      handEl.textContent = `✓ ${okLbl} (${cg.hand}) • ${shownCnt} ${isVi ? "mẫu" : "frames"}`;
    } else {
      handEl.className = "cg-hand-miss";
      handEl.textContent = "⚠ " + (colI18n.ov_hand_missing || (isVi ? "KHÔNG THẤY TAY!" : "NO HAND DETECTED!"));
    }

    // Priority 1: Cued Recall Mode
    if (cued.active || (cued.phase === "done" && cued.has_unsaved)) {
      dryEl.style.display = "inline-flex";
      dryEl.textContent = colI18n.cued_dry_run_badge || "DRY-RUN";
      progWrap.style.display = "block";
      nextEl.textContent = "";
      if (cued.phase === "done") {
        root.className = "visible state-done";
        modeEl.textContent = colI18n.ov_cued_done || "CUED RECALL DONE";
        stepEl.textContent = `${cued.cues_issued || 0} / ${cued.total_cues || 0}`;
        titleEl.textContent = `✓ ${colI18n.ov_cued_done || "HOÀN THÀNH"}`;
        subEl.textContent = colI18n.ov_cued_done_sub || "";
        timerEl.textContent = "✓";
        progFill.style.width = "100%";
      } else if (cued.phase === "cue") {
        root.className = "visible state-cue";
        modeEl.textContent = colI18n.ov_cued_go || "PERFORM NOW";
        stepEl.textContent = `${(cued.cue_index || 0) + 1} / ${cued.total_cues || 0}`;
        const trigKey = cued.expected_trigger || "";
        const trigTitle = colI18n["ov_trig_" + trigKey] || trigKey.toUpperCase();
        titleEl.textContent = `🎯 ${trigTitle}`;
        subEl.textContent = isVi ? (cued.instruction_vi || cued.instruction_en || "") : (cued.instruction_en || "");
        const rem = Number(cued.remaining_s || 0);
        const tot = Math.max(0.1, Number(cued.phase_total_s || 2.5));
        timerEl.textContent = rem.toFixed(1) + "s";
        progFill.style.width = Math.max(0, Math.min(100, (rem / tot) * 100)).toFixed(1) + "%";
      } else {
        // Rest phase: NEVER reveal upcoming cue before cue_ts_ms!
        root.className = "visible";
        modeEl.textContent = isVi ? "NGHỈ GIỮA LỆNH" : "REST INTERVAL";
        stepEl.textContent = `${(cued.cue_index || 0) + 1} / ${cued.total_cues || 0}`;
        titleEl.textContent = `⏸ ${colI18n.ov_cued_rest_title || "REST HAND"}`;
        subEl.textContent = colI18n.ov_cued_rest_sub || "";
        const rem = Number(cued.remaining_s || 0);
        const tot = Math.max(0.1, Number(cued.phase_total_s || 1.2));
        timerEl.textContent = rem.toFixed(1) + "s";
        progFill.style.width = Math.max(0, Math.min(100, (rem / tot) * 100)).toFixed(1) + "%";
      }
      return;
    }

    // Priority 2: Guided 14-Step Recording Script
    if (guided.active || guided.phase === "done") {
      dryEl.style.display = "none";
      progWrap.style.display = "block";
      if (guided.phase === "done") {
        root.className = "visible state-done";
        modeEl.textContent = colI18n.ov_guided_done || "DONE";
        stepEl.textContent = `${guided.total_steps || 14} / ${guided.total_steps || 14}`;
        titleEl.textContent = `✓ ${colI18n.ov_guided_done || "HOÀN THÀNH"}`;
        subEl.textContent = colI18n.ov_guided_done_sub || "";
        timerEl.textContent = "✓";
        progFill.style.width = "100%";
        nextEl.textContent = "";
      } else {
        const isRec = guided.phase === "recording";
        root.className = isRec ? "visible state-rec" : "visible";
        modeEl.textContent = isRec
          ? (colI18n.ov_guided_rec || "RECORDING")
          : (colI18n.ov_guided_prep || "GET READY");
        stepEl.textContent = `${isVi ? "Bước" : "Step"} ${(guided.step_index || 0) + 1} / ${guided.total_steps || 14}`;
        const pLbl = poses[guided.pose] || guided.pose || "idle";
        titleEl.textContent = pLbl;
        subEl.textContent = isVi
          ? (guided.condition_note_vi || guided.condition_note || "")
          : (guided.condition_note || "");
        const rem = Number(guided.remaining_s || 0);
        const tot = Math.max(0.1, Number(guided.phase_total_s || (isRec ? 5.0 : 3.0)));
        timerEl.textContent = rem.toFixed(1) + "s";
        progFill.style.width = Math.max(0, Math.min(100, (rem / tot) * 100)).toFixed(1) + "%";
        if (guided.next_pose) {
          const nPose = poses[guided.next_pose] || guided.next_pose;
          const nNote = isVi ? (guided.next_note_vi || guided.next_note || "") : (guided.next_note || "");
          nextEl.textContent = (colI18n.ov_next_prefix || "Next: ") + (nNote || nPose);
        } else {
          nextEl.textContent = "";
        }
      }
      return;
    }

    // Priority 3: Manual Recording Mode
    if (cg.recording) {
      dryEl.style.display = "none";
      progWrap.style.display = "none";
      root.className = "visible state-rec";
      modeEl.textContent = colI18n.ov_manual_rec || "MANUAL RECORDING";
      const curPose = cg.current_pose || "idle";
      const curCnt = (cg.counts && cg.counts[curPose]) || 0;
      stepEl.textContent = `${curCnt} ${isVi ? "mẫu" : "samples"}`;
      titleEl.textContent = poses[curPose] || curPose;
      subEl.textContent = colI18n.hold_hint || "";
      timerEl.textContent = "REC";
      nextEl.textContent = "";
      return;
    }

    root.className = "";
  }

  window.addEventListener("DOMContentLoaded", () => notifyHost("overlay_ready"));
</script>
</body>
</html>
